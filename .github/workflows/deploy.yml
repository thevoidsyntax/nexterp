name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────
  # Railway Backend (.NET API)
  # ─────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    env:
      # The Railway CLI authenticates every command from this env var directly —
      # there is no separate `railway login --token` flag on current CLI versions.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        # Railway service ID (not the "ERP-API" name — that didn't resolve
        # against this project, "Service not found").
        run: railway up --service 0b6e64f5-43c0-48b5-8088-35c77d43ce91

      - name: Set Railway Variables
        run: |
          railway variables set ASPNETCORE_ENVIRONMENT=Production
          railway variables set Jwt:SecretKey=$JWT_SECRET_KEY
          railway variables set Jwt:AccessTokenExpirationMinutes=15
          railway variables set Jwt:RefreshTokenExpirationDays=7
          railway variables set Redis:ConnectionString=$REDIS_CONNECTION_STRING
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          REDIS_CONNECTION_STRING: ${{ secrets.REDIS_CONNECTION_STRING }}

      - name: Wait for deployment
        run: sleep 20

      - name: Get Railway URL
        run: railway domain list || echo "Check Railway dashboard"

  # ─────────────────────────────────────────────────────
  # Vercel Frontend (Next.js)
  # ─────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    needs: [deploy-backend]
    defaults:
      run:
        working-directory: nextjs-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nextjs-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Run tests
        run: npm run test || true

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./nextjs-frontend
