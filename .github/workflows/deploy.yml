name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────
  # Railway Backend (.NET API)
  # ─────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    env:
      # The Railway CLI authenticates every command from this env var directly —
      # there is no separate `railway login --token` flag on current CLI versions.
      # This is a *project* token, scoped to only the backend project below —
      # it will not authenticate against the frontend project (see
      # deploy-frontend's own RAILWAY_TOKEN_FRONTEND, a separate project token).
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # `up`/`variable`/`domain` all resolve against a *linked* project, and
      # nothing here ever links one — that's why "Service not found" persisted
      # even after the service ID and the token were both fixed. Passing
      # --project explicitly is required.
      #
      # IDs below are for the project whose service serves
      # api-production-ab1b.up.railway.app (the URL nextjs-frontend actually
      # talks to) — confirmed against the Railway dashboard, not guessed.
      # Two other unrelated ERP projects exist in the same Railway account;
      # don't swap these for one of those without reconfirming the domain.
      RAILWAY_PROJECT_ID: '5aa9d430-1ef0-4abd-8d62-0c85ffee2494'
      RAILWAY_SERVICE_ID: '8671206e-8d29-43a9-a4ac-5db103504390'
      # Current Railway CLI requires --environment whenever --project is
      # passed explicitly ("--environment is required when using --project").
      RAILWAY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT"

      - name: Set Railway Variables
        # JWT_SECRET_KEY/REDIS_CONNECTION_STRING come from GitHub secrets - if
        # either one isn't set, $VAR expands to an empty string and this used
        # to happily `railway variables set` it anyway, blanking out whatever
        # value Railway already had and crash-looping the service (empty
        # Jwt:SecretKey / Redis:ConnectionString). Skip the write instead of
        # clobbering a working value with nothing.
        run: |
          railway variables set ASPNETCORE_ENVIRONMENT=Production --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT"
          if [ -n "$JWT_SECRET_KEY" ]; then
            railway variables set "Jwt:SecretKey=$JWT_SECRET_KEY" --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT"
          else
            echo "::warning::JWT_SECRET_KEY secret is empty - leaving Railway's existing Jwt:SecretKey untouched"
          fi
          railway variables set Jwt:AccessTokenExpirationMinutes=15 --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT"
          railway variables set Jwt:RefreshTokenExpirationDays=7 --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT"
          if [ -n "$REDIS_CONNECTION_STRING" ]; then
            railway variables set "Redis:ConnectionString=$REDIS_CONNECTION_STRING" --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT"
          else
            echo "::warning::REDIS_CONNECTION_STRING secret is empty - leaving Railway's existing Redis:ConnectionString untouched"
          fi
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          REDIS_CONNECTION_STRING: ${{ secrets.REDIS_CONNECTION_STRING }}

      - name: Wait for deployment
        run: sleep 20

      - name: Get Railway URL
        run: railway domain list --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT" || echo "Check Railway dashboard"

  # ─────────────────────────────────────────────────────
  # Railway Frontend (Next.js)
  # ─────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    needs: [deploy-backend]
    env:
      # A *different* Railway project token than deploy-backend's RAILWAY_TOKEN -
      # project tokens are scoped to one project each, and this job's project
      # is not the same one the backend token was issued for.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_FRONTEND }}
      # A separate Railway project from the API (see deploy-backend) - confirmed
      # as the project/service serving nexterp-frontend-production.up.railway.app.
      # A 3rd, unrelated ERP project also exists on this account; don't swap
      # these for it without reconfirming the domain.
      RAILWAY_PROJECT_ID: 'ffa98358-68bc-4eaa-bdd3-d664d7ab7ca8'
      RAILWAY_SERVICE_ID: 'c6d2d439-c39b-4bb9-8982-d3dd7b105ad3'
      RAILWAY_ENVIRONMENT: production
    defaults:
      run:
        working-directory: nextjs-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nextjs-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Sanity check only - nextjs-frontend/Dockerfile rebuilds from source
        # on Railway's side, this local build doesn't ship the deployed artifact.
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Run tests
        run: npm run test || true

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        # Runs from nextjs-frontend/ (this job's working-directory default) so
        # the uploaded build context matches what nextjs-frontend/Dockerfile
        # expects (COPY package*.json ./, COPY . .) regardless of the
        # service's dashboard root-directory setting.
        run: railway up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT"

      - name: Get Railway URL
        run: railway domain list --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT" || echo "Check Railway dashboard"
